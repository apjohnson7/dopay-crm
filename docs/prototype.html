  mstrip([['Active schedules',list.filter(r=>r.status==='Active').length],['Billed per month',F(mrr),'ok'],['Due today',due.length,due.length?'warn':''],['Awaiting approval',list.filter(r=>r.status==='Pending approval').length,list.some(r=>r.status==='Pending approval')?'warn':''],['Invoices raised',list.reduce((a,r)=>a+r.runs.length,0)]])+
  `<div style="margin-bottom:10px">${scopeNote()} · <span class="small muted">The schedule runs every morning at 06:00 branch time.</span></div>

   {h:'Frequency',f:r=>FREQ[r.every]||r.every+' months'},{h:'Per invoice',cls:'num',f:r=>fmt(calc(r).total,r.cur)},{h:'Next invoice',f:r=>r.status==='Active'?(r.next<=TODAY?`<b style="color:var(--warn)">${fdate(r.next)}</b>`:fdate(r.next)):'—'},
   {h:'Sent by',f:r=>esc(r.send||'Not sent')},{h:'Raised',cls:'num',nosum:true,f:r=>r.runs.length},{h:'Status',f:r=>pill(r.status==='Active'&&r.next<=TODAY?'Due today':r.status)},
   {h:'',f:r=>recActions(r)}],list,{empty:'No schedules yet. Press New schedule.'})}</section>
  <p class="note" style="margin-top:12px">${ic('info',13)} Editing the lines or amount of a schedule sends it back for approval. Invoices already raised are not changed; correct those with a credit note.</p>`};
function recActions(r){const a=[];const appr=can('invoices.approve');
  if(r.status==='Pending approval'&&appr&&r.createdBy!==S.user)a.push(btn('Approve','recApprove',{cls:'sm',kind:'pri',data:{id:r.id}}));
  if(r.status==='Active'&&r.next<=TODAY)a.push(btn('Run now','recRun',{cls:'sm',kind:'pri',perm:'invoices.create',data:{id:r.id}}));
  if(r.status==='Active')a.push(btn('Pause','recPause',{cls:'sm',perm:'invoices.create',data:{id:r.id}}));
  if(r.status==='Paused')a.push(btn('Resume','recResume',{cls:'sm',perm:'invoices.create',data:{id:r.id}}));
  if(r.runs.length)a.push(btn('Invoices','recInv',{cls:'sm',kind:'ghost',data:{id:r.id}}));
  return `<div class="row" style="flex-wrap:nowrap">${a.join('')}</div>`}
A.recApprove=d=>{const r=S.recurring.find(x=>x.id===d.id);if(r.createdBy===S.user){toast('Someone other than the preparer must approve');return}r.status='Active';r.approvedBy=S.user;log('Approved recurring schedule',r.id,'Pending approval','Active · '+r.name);toast('Schedule approved. It raises its first invoice on '+fdate(r.next));render(true)};
A.recPause=d=>{const r=S.recurring.find(x=>x.id===d.id);r.status='Paused';log('Paused recurring schedule',r.id,'Active','Paused');render(true)};

function creditedQty(i){const q=(i.items||[]).map(()=>0);S.credits.filter(n=>n.inv===i.no&&n.status!=='Rejected').forEach(n=>n.items.forEach(it=>{if(it.src!=null&&q[it.src]!=null)q[it.src]+=+it.qty||0}));return q}

function approveCredit(n,by){const i=invBy(n.inv);const k=calc(n);const applied=Math.min(k.total,Math.max(0,calc(i).bal));i.credited=rnd((i.credited||0)+applied,i.cur);n.applied=rnd(applied,n.cur);n.refundDue=rnd(k.total-applied,n.cur);n.status='Approved';n.approvedBy=by;fiscalise(n)}
function seedCredit(inv,date,lines,reasonType,reason,by,appr){const i=invBy(inv);const n={no:nextNo(i.country,'CRN'),inv,cust:i.cust,country:i.country,branch:i.branch,cur:i.cur,date,reasonType,reason,status:'Pending approval',createdBy:by,approvedBy:'',

function payePeriods(cc){const cur=country(cc).cur;const pc=acctByRole(cc,'paye').code,sc=acctByRole(cc,'exp_salaries').code;const M={};const at=p=>M[p]=M[p]||{g:0,w:0};
  glEntries(cc).forEach(e=>{if(e.src!=='JNL')return;e.lines.forEach(l=>{const p=ym(e.date);if(l.a===pc&&l.cr)at(p).w+=l.cr;if(l.a===sc&&l.dr)at(p).g+=l.dr})});
  const pays=taxPays(cc).filter(e=>e.taxKind==='PAYE'||/\bpaye\b/i.test(e.desc));pays.forEach(e=>at(payPeriod(e)));
  return Object.keys(M).sort().reverse().map(p=>{const paid=rnd(pays.filter(e=>payPeriod(e)===p&&e.status==='Paid').reduce((a,e)=>a+e.amount,0),cur);const bal=rnd(M[p].w-paid,cur);const due=taxDue(cc,p);
    return {p,g:M[p].g,w:M[p].w,paid,bal,due,status:p>=ym(TODAY)?'Open period':bal<=0?'Paid':due<TODAY?'Overdue':'Due'}})}

function p2Alerts(){const L=[];const al=(act,sv,t,s,n)=>L.push(`<button class="alert" ${act}><span class="sv ${sv}"></span><div><b>${t}</b><span>${s}</span></div><span class="n">${n}</span></button>`);
  const rej=[...S.invoices,...S.credits].filter(x=>inScope(x)&&x.fiscal&&x.fiscal.status==='Rejected');if(rej.length)al('data-act="nav" data-r="einvoice"','bad','E-invoices rejected by the tax authority',rej.slice(0,2).map(x=>esc(x.no.slice(-6))).join(', '),rej.length);
  const rf=S.credits.filter(n=>inScope(n)&&n.refundDue>0);if(rf.length)al('data-act="nav" data-r="credits"','bad','Refunds owed to customers',rf.map(n=>esc(cname(cust(n.cust)))+' · '+fmt(n.refundDue,n.cur)).slice(0,2).join(', '),rf.length);
  const cnP=S.credits.filter(n=>inScope(n)&&n.status==='Pending approval'),rP=S.recurring.filter(r=>inScope(r)&&r.status==='Pending approval');if(cnP.length+rP.length)al('data-act="nav" data-r="'+(cnP.length?'credits':'recurring')+'"','warn','Credit notes and schedules to approve',`${cnP.length} credit note${cnP.length===1?'':'s'}, ${rP.length} recurring schedule${rP.length===1?'':'s'}`,cnP.length+rP.length);
  const rd=recDue();if(rd.length)al('data-act="nav" data-r="recurring"','info','Recurring invoices due today',rd.map(r=>esc(r.name)).slice(0,2).join(', '),rd.length);
  const qa=S.quotes.filter(q=>inScope(q)&&q.kind==='QUO'&&q.status==='Accepted');if(qa.length)al('data-act="openQuo" data-no="'+qa[0].no+'"','ok','Accepted quotes to invoice',qa.map(q=>esc(cname(cust(q.cust)))).slice(0,2).join(', '),qa.length);
  const qe=S.quotes.filter(q=>inScope(q)&&q.kind==='QUO'&&q.status==='Sent'&&q.due>=TODAY&&diff(TODAY,q.due)<=14);if(qe.length)al('data-act="nav" data-r="quotes"','info','Quotes expiring within 14 days',qe.map(q=>esc(cname(cust(q.cust)))+' · '+fdate(q.due).slice(0,6)).slice(0,2).join(', '),qe.length);
  return L}

 {id:'einv',t:'E-invoicing with URA, FIRS and DGI',k:['e-invoicing','einvoicing','e invoice','efris','ura','firs','fne','dgi','fiscal','fiscalise','fdn','irn','qr code','tax authority','fiscal receipt'],

const FR_RX=[[/^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday), (\d+) (\w+) (\d{4})$/,m=>{const x=m.match(/^(\w+), (\d+) (\w+) (\d{4})$/);return FR_DAY[x[1]]+' '+x[2]+' '+(FR_MON[x[3]]||x[3])+' '+x[4]}],

 [/^No payment provider is connected for (.+) yet\.$/,m=>{const x=m.match(/for (.+) yet\.$/);return 'Aucun prestataire de paiement n’est encore connecté pour '+frc(x[1])+'.'}],[/^(.+) · all branches$/,m=>frc(m.slice(0,-15))+' · toutes les agences'],[/^(.+) · (.+) · all branches$/,m=>m.replace(' · all branches',' · toutes les agences')],

function trStr(t){if(FR[t]!=null)return FR[t];for(const [rx,rep] of FR_RX){if(rx.test(t))return typeof rep==='function'?rep(t):t.replace(rx,rep)}return null}
function trNode(root){if(S.lang!=='fr'||!root)return;if(root.nodeType===3){const p=root.parentElement;if(p&&!p.closest('script,style,.mono,.paper,[data-notr],textarea'))trText(root);return}
  if(root.nodeType!==1||root.closest('script,style,[data-notr]'))return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&!n.parentElement.closest('script,style,.mono,.paper,[data-notr],textarea')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const L=[];while(w.nextNode())L.push(w.currentNode);L.forEach(trText);
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{if(el.closest('[data-notr]'))return;['placeholder','title'].forEach(a=>{const v=el.getAttribute(a);const r=v&&trStr(v);if(r!=null)el.setAttribute(a,r)})})}
function trText(n){const v=n.nodeValue;const t=v.trim();if(!t||t.length>80)return;const r=trStr(t);if(r!=null&&r!==t)n.nodeValue=v.replace(t,r)}
new MutationObserver(ms=>{if(S.lang!=='fr')return;ms.forEach(m=>m.addedNodes.forEach(trNode))}).observe(document.body,{childList:true,subtree:true});
