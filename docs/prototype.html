/* ============ global search ============ */
function searchAll(q){const inA=r=>{const cc=recCC(r);return !cc||(S.acct==='ALL'?myAccts().includes(cc):cc===S.acct)};const toks=q.toLowerCase().split(/\s+/).filter(Boolean).map(t=>t.replace(/,/g,''));if(!toks.length)return [];
  const hit=h=>toks.every(t=>h.includes(t));const R=[];const push=(g,t,s,act)=>R.push({g,t,s,act});
  S.customers.filter(inA).forEach(c=>{const nums=[...S.invoices.filter(i=>i.cust===c.id).map(i=>calc(i).total),...S.payments.filter(p=>p.cust===c.id).map(p=>p.amount)].join(' ');
    if(hit([c.id,c.name,c.company,c.phone,c.phone.replace(/\D/g,''),c.email,c.tin,nums].join(' ').toLowerCase()))push('Customers',cname(c),c.id+' · '+c.phone,`data-act="openCust" data-id="${c.id}"`)});
  S.invoices.filter(inA).forEach(i=>{const c=cust(i.cust);const k=calc(i);if(hit([i.no,c.name,c.company,k.total,k.bal,st(i)].join(' ').toLowerCase()))push('Invoices',i.no,cname(c)+' · '+fmt(k.total,i.cur)+' · '+st(i),`data-act="openInv" data-no="${i.no}"`)});
  S.payments.filter(inA).forEach(p=>{const c=cust(p.cust);if(hit([p.no,p.ref,c.name,c.company,p.amount,p.method].join(' ').toLowerCase()))push('Payments',p.no,cname(c)+' · '+fmt(p.amount,p.cur)+' · '+p.ref,`data-act="nav" data-r="payments"`)});
  S.receipts.filter(r=>inA(payBy(r.pay)||{})).forEach(r=>{const p=payBy(r.pay);const c=cust(p.cust);if(hit([r.no,p.ref,c.name,c.company,p.amount].join(' ').toLowerCase()))push('Receipts',r.no,cname(c)+' · '+fmt(p.amount,p.cur),`data-act="openRct" data-no="${r.no}"`)});
  S.customers.filter(inA).forEach(c=>{if(hit(['statement',c.name,c.company,c.id].join(' ').toLowerCase()))push('Statements','Statement · '+cname(c),c.id,`data-act="openStmt" data-id="${c.id}"`)});
  S.docs.filter(inA).forEach(d=>{if(hit([d.name,d.tags.join(' '),d.cat,linkName(d)].join(' ').toLowerCase()))push('Documents',d.name,d.link+' · '+linkName(d),`data-act="nav" data-r="documents"`)});
  (S.forms||[]).filter(f=>inA(f)||awaitingMe(f)).forEach(f=>{if(f.ref&&hit([f.ref,FT[f.type].name,fSubject(f),user(f.by).name,fTotal(f),country(f.country).name,...(f.lines||[]).map(l=>l.desc||l.purpose||'')].join(' ').toLowerCase()))push('Finance forms',f.ref,FT[f.type].name+' · '+fSubject(f),`data-act="openForm" data-id="${f.id}"`)});
  return R}
function renderSearch(){const q=$('#gsearch').value.trim();const box=$('#sres');if(!q){box.hidden=true;return}const R=searchAll(q);
  if(!R.length){box.innerHTML=`<div class="empty">No matches for “${esc(q)}”.</div>`;box.hidden=false;return}
  const groups={};R.forEach(r=>(groups[r.g]=groups[r.g]||[]).push(r));
  box.innerHTML=Object.entries(groups).map(([g,l])=>`<div class="g">${g} · ${l.length}</div>${l.slice(0,5).map(r=>`<button ${r.act} data-close-search="1"><b>${esc(r.t)}</b><span>${esc(r.s)}</span></button>`).join('')}`).join('');box.hidden=false}

/* ============ ASK DOPAY: platform guide ============ */
const KB=[
 {id:'ledger',t:'Accounting: ledger, statements, reconciliation and month-end close',k:['ledger','general ledger','journal','journal entry','chart of accounts','accounts','balance sheet','profit and loss','p&l','income statement','cash flow','trial balance','reconcile','reconciliation','bank statement','month end','close','closing','period','lock','syscohada','ifrs','consolidated','intercompany','revaluation','books','double entry','debit','credit'],
  a:`DoPay keeps double-entry books for each country under <b>Accounting</b>.<ul><li><b>Posting is automatic</b>: approved invoices, payments, paid expenses, cash advances and interbranch memos post debits and credits for you. Use <b>New journal entry</b> only for things DoPay doesn’t record, such as payroll or accruals; large journals need a second person.</li><li><b>Chart of accounts</b>: Uganda and Nigeria use an IFRS-based chart; Cameroon and Ivory Coast use SYSCOHADA.</li><li><b>Financial statements</b>: profit and loss, balance sheet, cash flow and trial balance per country, plus a consolidated USD view for the Super Administrator with intercompany balances removed.</li><li><b>Reconciliation</b>: import the bank or mobile money statement as CSV, press <b>Auto-match</b>, then match or record what is left.</li><li><b>Month-end close</b>: once the checklist is done a Finance Manager closes the month; nothing dated in it can change unless it is reopened with a second person’s approval.</li></ul>`,go:['fs','Open financial statements']},
 {id:'accounts',t:'Country accounts: who sees what',k:['account','accounts','country account','switch country','other country','all countries','see nigeria','see uganda','separate','consolidated','super admin','super administrator','country administrator','access','data separation'],
  a:`Each country runs as its own <b>DoPay account</b> with its own customers, invoices, payments, suppliers, expenses, taxes, numbering, users and company details.<ul><li><b>Everyone else</b> works only inside their own country’s account. Their search, reports, audit trail and Ask Dopay answers never include another country.</li><li>The <b>Super Administrator</b> can open every account from the selector at the top, or choose <b>All accounts</b> for a consolidated view in USD.</li><li>A <b>Country Administrator</b> manages their own account: users, company details, suppliers and settings.</li><li>Group approvers (Financial Controller, Regional Manager, CFO, CEO) still sign forms routed to them from any country, but they can’t browse other countries’ records.</li><li>Team messages work across countries, so officers can still talk to each other.</li></ul>`,go:['settings','Open account settings']},
 {id:'supplier',t:'Adding and editing suppliers',k:['supplier','suppliers','vendor','vendors','add supplier','new supplier','edit supplier','supplier bank','payee'],
  a:`Go to <b>Spending & forms → Suppliers</b> and click <b>New supplier</b>. Enter the company, contact, country, TIN, payment terms, what they supply and bank details. Click a supplier in the list to edit it.<ul><li>Only the <b>Super Administrator</b> and <b>Finance Manager</b> can add or edit suppliers by default. An administrator can give other roles the “Add & edit suppliers” permission in Users & roles.</li><li>Dopay blocks duplicates with the same name or TIN.</li><li>Bank detail changes are written to the audit trail and the Finance Manager is notified.</li><li>New suppliers appear straight away in the Supplier list when you record an expense.</li></ul>`,go:['suppliers','Open Suppliers']},
 {id:'grid',t:'Working with tables: sort, filter, totals, export to Excel',k:['sort','filter','table','tables','export','excel','csv','download','print table','total','totals','columns','spreadsheet','collapse menu','sidebar'],
  a:`Every list works like a spreadsheet:<ul><li><b>Sort</b>: click a column heading; click again to reverse.</li><li><b>Filter</b>: type in <b>Filter these rows</b> above the table. The row count and totals update as you type.</li><li><b>Totals</b>: the grey row at the bottom adds up money columns for the visible rows. Failed, reversed and cancelled items are left out.</li><li><b>Export</b> downloads the visible rows as a CSV file that opens in Excel; <b>Print</b> prints just that table.</li><li>Shaded bars in Balance and Outstanding show the biggest amounts at a glance; red means overdue.</li></ul>Need more room? Click the arrow next to the logo to collapse the menu to icons.`,go:['invoices','Open Invoices']},
 {id:'tax',t:'Taxes: VAT, returns and tax payments',k:['tax','taxes','vat','tva','vat return','tax return','file vat','remit','remittance','paye','withholding','tax rate','tax payment','filing','filing day','ura','firs','tax authority'],
  a:`Open <b>Payments & tax → Taxes</b> and pick a country. Each month shows the <b>VAT/TVA charged</b> on approved invoices, the amount <b>remitted</b>, the <b>balance</b> and the due date.<ul><li><b>Pay a return</b>: click <b>Record payment</b> on the month. It opens a Tax-category expense with the period and balance filled in; it counts as remitted once the expense reaches Paid.</li><li><b>PAYE, withholding and other taxes</b>: record them as expenses in the <b>Tax</b> category; they list under Other taxes paid and feed the Tax line in budget monitoring.</li><li><b>Rates and filing days</b>: Settings → Finance. Issued invoices keep the rate they were created with.</li><li>The <b>invoice register</b> lists each invoice with the customer TIN for your return; <b>Copy CSV</b> exports the monthly summary.</li></ul>`,go:['taxes','Open Taxes']},
 {id:'start',t:'Getting around Dopay',k:['getting started','overview','modules','menu','navigate','sidebar','what is dopay','start','tour','features'],
  a:`Dopay keeps customers, billing, spending, finance forms and administration in one place:<ul><li><b>Dashboard</b> shows what needs attention today.</li><li><b>Billing</b>: Customers, Quotes & orders, Invoices, Recurring invoices, Credit notes, Customer portal.</li><li><b>Payments & tax</b>: Payments, Receipts, Online payments, Taxes, E-invoicing.</li><li><b>Accounting</b>: Chart of accounts, Journals & ledger, Financial statements, Reconciliation, Month-end close.</li><li><b>Spending & forms</b>: Finance forms (Appendices A–K), Expenses, Suppliers.</li><li><b>Catalogue & records</b>: Products, Documents, Reports, Communications.</li><li><b>Administration</b>: Users & roles, Audit trail, Settings.</li></ul>Search anything from the bar at the top (press <b>/</b>), and switch branch or country from the selector next to it.`,go:['dashboard','Open dashboard']},
 {id:'search',t:'Finding any record fast',k:['search','find','look up','lookup','locate','shortcut'],
  a:`Use the search bar at the top of every page (press <b>/</b> to jump to it). Type several words and Dopay matches them all, across customers, invoices, payments, receipts, statements, documents and finance forms. For example <i>John 250000</i> finds John Uganda Ltd’s UGX 250,000 payment and its receipt.`},
 {id:'branch',t:'Switching branch, country and currency',k:['branch','switch branch','country','countries','consolidated','all branches','currency view','usd'],
  a:`The branch selector at the top decides what you see. Pick a branch to work in its local currency, or <b>All branches · USD</b> for consolidated figures converted at the recorded exchange rates. Local roles (accountants, country managers) are placed in their own branch automatically; the Financial Controller, Regional Manager, CFO and CEO see all countries.`},
 {id:'customer',t:'Adding a customer or member',k:['add customer','new customer','add a customer','customer','customers','register customer','member','customer profile','edit customer','credit limit'],
  a:`Go to <b>Billing → Customers</b> and press <b>New customer</b> (or use the quick action on the Dashboard). Choose the branch; country, currency and tax follow from it. Once saved, the customer’s details fill every invoice, receipt and statement automatically. Changing a credit limit is logged in the audit trail.`,go:['customers','Open Customers'],act:['newCustomer','New customer','customers.manage']},
 {id:'invoice',t:'Creating an invoice',k:['create invoice','new invoice','make invoice','raise invoice','invoice builder','bill a customer','invoice'],
  a:`<ol><li>Press <b>New invoice</b> (Dashboard or Billing → Invoices).</li><li>Pick the customer: address, tax ID, currency and terms load by themselves.</li><li>Add products or custom lines; totals, discount and VAT calculate as you type, with a live preview.</li><li>Press <b>Submit for approval</b>. Once approved, <b>Generate official PDF</b>, then send it.</li></ol>The number (e.g. DOPAY-UG-INV-2026-000237) follows your country’s sequence.`,act:['newInvoice','New invoice','invoices.create']},
 {id:'approveinv',t:'Who approves invoices',k:['approve invoice','invoice approval','pending approval','approve','approval invoice','who approves','approves invoices','invoice approver','approve an invoice'],
  a:`Invoices submitted by officers wait for a <b>Finance Manager</b>, <b>Branch Manager</b>, <b>Assistant/Country Manager</b>, <b>Financial Controller</b> or <b>CFO</b>. Approvers see them under <b>Invoices → Pending approval</b> and on the Dashboard. After approval, the preparer generates the official PDF.`,go:['invoices','Open Invoices'],fil:'Pending approval'},
 {id:'sendinv',t:'Sending an invoice, receipt or statement',k:['send invoice','share','send a receipt','send a statement','send an invoice','whatsapp','email invoice','telegram','imo','copy link','share link','send receipt','send statement'],
  a:`Open the document and use <b>Send & share</b>: WhatsApp and Telegram open with the message and a secure link filled in; Email opens a pre-filled message with the PDF attached; IMO copies the message for pasting. Every send is saved to the customer’s timeline and the Communications log. Invoices unlock sharing once approved and generated.`},
 {id:'payment',t:'Recording a payment',k:['record payment','record a payment','payment','paid','customer paid','receive money','mobile money','allocate','split payment','partial payment'],
  a:`Press <b>Record payment</b>, choose the customer, enter amount, method and transaction reference, then <b>Auto-allocate oldest first</b> (or split it across invoices yourself). Saving updates the invoices’ balances and issues a receipt straight away. Anything not allocated stays as credit on the account.`,act:['recordPayment','Record payment','payments.record']},
 {id:'receipt',t:'Issuing receipts',k:['receipt','issue receipt','create receipt','reprint receipt'],
  a:`Receipts are generated from recorded payments, so the amount and reference always match. Record the payment and the receipt opens ready to print or share. Past receipts are under <b>Billing → Receipts</b>.`,go:['receipts','Open Receipts']},
 {id:'reverse',t:'Refunding or reversing a payment',k:['reverse','refund','reverse a payment','refund a payment','reversal','cancel payment','wrong payment'],
  a:`In <b>Payments & tax → Payments</b> press <b>Reverse</b> on the payment. It needs a reason and a second person’s authorization with their PIN. The invoice balance goes back up, the receipt is voided, and both stay in the audit trail; nothing is deleted.`,go:['payments','Open Payments']},
 {id:'statement',t:'Customer statements',k:['statement','account statement','balance','customer balance','statement of account'],
  a:`Open the customer and choose the <b>Statement</b> tab. Pick a period (this month, last month, quarter, year) to see date, reference, debit, credit and running balance, then send it by WhatsApp, email or link.`,go:['customers','Open Customers']},
 {id:'forms',t:'Finance forms (Appendices A–K)',k:['finance forms','forms','appendix','appendices','fill online','template form','paper forms'],
  a:`All your finance forms live in <b>Spending & forms → Finance forms</b>: Expense Memorandum (A), Petty Cash Voucher (B), Receipt Reimbursement Certification (C), Budgets (F), Branch Financial Report (G), Interbranch Transfer Memo (J) and Cash Advance Request (K). Press <b>Fill online</b>; the entity, currency and reference number fill in, the preview matches your printed template, and submitting starts the approval chain.`,go:['forms','Open Finance forms']},
 {id:'memo',t:'Expense Memorandum (Appendix A)',k:['expense memo','expense memorandum','memo','appendix a','request funds','approval route','regional manager route','cfo route'],
  a:`<ol><li>Finance forms → Expense Memorandum → <b>Fill online</b>.</li><li>Choose the approval route: <b>Regional Manager</b> (Template 1) or <b>CFO/CEO</b> (Template 2).</li><li>Add lines with category and amount, the payment details and the justification.</li><li>Attach receipts or link a Receipt Reimbursement Certification (required).</li><li>Submit. It needs all four signatures: Accountant/AM → CM or RM → Global Financial Controller → RM or CFO/CEO.</li></ol>When approved, <b>Mark as paid</b> posts each line to Expenses and budget monitoring.`,act:['fNew','New expense memo','forms.submit',{t:'A'}]},
 {id:'petty',t:'Petty Cash Voucher (Appendix B)',k:['petty cash','voucher','impress','imprest','appendix b','float'],
  a:`Finance forms → Petty Cash Voucher. Enter who was paid, the petty cash holder and the lines; amount in words is written for you. The holder signs “Paid by” and an Accountant or Branch Manager signs “Approved by” (the holder can never approve their own voucher). Link the Expense Memorandum that reimburses the float, then <b>Mark reimbursed</b>. Prints two vouchers per A4 sheet.`,act:['fNew','New petty cash voucher','forms.submit',{t:'B'}]},
 {id:'cert',t:'No receipt? Receipt Reimbursement Certification (Appendix C)',k:['no receipt','receipt reimbursement','certification','appendix c','lost receipt','without receipt'],
  a:`When a vendor can’t give a receipt, fill <b>Receipt Reimbursement Certification</b>: the purchaser lists the payments and certifies them, then an Accountant or Assistant Manager approves. Once approved, <b>Use in a new expense memo</b> links it as the memo’s supporting document.`,act:['fNew','New certification','forms.submit',{t:'C'}]},
 {id:'budget',t:'Budgets and budget monitoring (Appendix F)',k:['budget','budgets','annual budget','quarterly budget','monthly budget','budget monitoring','variance','actual vs budget','over budget','appendix f'],
  a:`Prepare a <b>Monthly, Quarterly or Annual</b> budget in Finance forms → Expense Budget across the 21 expense categories; the Financial Controller reviews it. <b>Budget monitoring</b> (card on the Finance forms page) compares the approved annual budget with actual spending by month or year to date. Actuals post automatically from paid expenses and memos; bars turn amber at 90% and red over 100%.`,go:['budget','Open budget monitoring']},
 {id:'branchreport',t:'Branch Financial Report (Appendix G)',k:['branch financial report','financial report','bank reconciliation','reconcile','bank statement','appendix g','monthly report','15th'],
  a:`Finance forms → Branch Financial Report. Enter the month, bank and opening balance, then <b>Import from Dopay</b> to pull that month’s payments and paid expenses. Add the closing balance from the bank statement and attach the statement. You can only submit when the difference is zero. Due to HQ by the <b>15th of the following month</b>; it’s signed by the Accountant, CM/AM, Finance Manager and Financial Controller.`,act:['fNew','New branch report','forms.submit',{t:'G'}]},
 {id:'interbranch',t:'Interbranch funding (Appendix J)',k:['interbranch','intercompany','inter-branch','another branch pays','fund transfer','appendix j'],
  a:`When one country pays another’s expenses, fill <b>Interbranch Transfer Memorandum</b>: choose the paying and receiving entity and pick approved memo references (description and amount fill in). The paying branch’s accountant acknowledges it and the Financial Controller notes it. Approved memos appear under <b>Intercompany payables</b> on the Finance forms page until you <b>Record repayment</b>.`,act:['fNew','New interbranch memo','forms.submit',{t:'J'}]},
 {id:'advance',t:'Cash advances (Appendix K)',k:['cash advance','advance','appendix k','liquidation','liquidate','per diem','pocket money','customs clearing'],
  a:`Fill <b>Cash Advance Request Form</b> with the purpose, amounts and expected date of use; the liquidation date is set to 5 working days after use (Policy 14.4). Five signatures: Accountant/AM → CM or RM → Financial Controller → CFO → CEO. After <b>Disburse advance</b>, record the liquidation with receipts; late ones are flagged on the Dashboard.`,act:['fNew','New cash advance','forms.submit',{t:'K'}]},
 {id:'sign',t:'Signing and approving forms',k:['sign','signature','e-signature','who signs','signs','sign a form','approve form','my signature','awaiting my signature','queue','return form','reject','pin'],
  a:`Forms waiting for you show on the Dashboard, in the sidebar badge and under <b>Finance forms → Awaiting my signature</b>. Open one, check the preview, press <b>Sign</b> and enter your PIN. Dopay stamps your name, date, local time and a signature ID. Use <b>Return</b> with a comment to send it back to the preparer. You can only sign steps that match your role and country.`,go:['forms','Open my queue'],ff:'Awaiting my signature'},
 {id:'revise',t:'Changing something already approved',k:['edit approved','revise','approved invoice','change an approved','already approved','edit an approved','change approved','void','cancel form','cancel invoice','authorization','authorize'],
  a:`Approved invoices and forms can’t be edited silently. Use <b>Revise (authorized)</b> or <b>Edit</b> on the document: give a reason and a second approver’s PIN. The revision restarts the approval chain and the audit trail keeps the before and after. Cancelling or voiding works the same way; nothing is deleted.`},
 {id:'print',t:'Printing and downloading',k:['print','pdf','download','word','excel','docx','xlsx','export form','printout'],
  a:`Every invoice, receipt and form has <b>Print</b> and <b>PDF</b>. Finance forms can also download as your original <b>Word or Excel</b> template, filled in. Forms print on A4 (budgets and branch reports in landscape; petty cash vouchers two per sheet), and signatures print with their date, time and signature ID. Reports export to PDF, Excel or CSV.`},
 {id:'expense',t:'Expenses vs expense memos',k:['expense','expenses','new expense','spend','spending','supporting document','upload receipt','difference between','expenses and expense','expense module'],
  a:`<b>Expenses</b> is the ledger of what was spent (Draft → Submitted → Reviewed → Approved → Paid). A paid <b>Expense Memorandum</b> or liquidated cash advance posts its lines here automatically. For small items you can add an expense directly with <b>New expense</b> and attach the receipt.`,go:['expenses','Open Expenses']},
 {id:'numbers',t:'Reference numbers',k:['reference number','ref no','numbering','invoice number format','sequence','ugd2026'],
  a:`Numbers follow your templates per country: <b>UGD2026-A-017</b> (memo), <b>UGD-HQ-2026-B-004</b> (petty cash), <b>UGD-J-2026-012</b> (interbranch), <b>UGD2026-K-002</b> (cash advance), and DOPAY-UG-INV-2026-000237 for invoices. Change the patterns in <b>Settings → Documents</b>.`,go:['settings','Open Settings'],tab:'docs'},
 {id:'rates',t:'Exchange rates and currencies',k:['exchange rate','rates','currency','usd rate','convert','base currency'],
  a:`Set units per 1 USD in <b>Settings → Finance</b>. Each transaction stores the rate on its date, so past invoices never change when you update rates. Consolidated reports use USD as the base currency.`,go:['settings','Open Settings'],tab:'fin'},
 {id:'addcountry',t:'Adding a country or branch',k:['add country','new country','add branch','new branch','kenya','expand','entity','add a country','add a branch','another country','new market','open a branch'],
  a:`In <b>Settings → Countries & branches</b> press <b>Add country</b> (name, code, currency, rate, tax), then <b>Add branch</b>. Numbering, currency, tax and approvers start working straight away, without code changes.`,go:['settings','Open Settings'],tab:'geo'},
 {id:'users',t:'Users, roles and permissions',k:['user','users','role','roles','permission','permissions','invite','access','who can'],
  a:`<b>Administration → Users & roles</b> lists everyone with their role, branch and 2FA status. Super Administrators invite users and tick permissions per role in the matrix. Form approval steps follow roles: Accountant, Assistant Manager, Country Manager, Regional Manager, Financial Controller, Finance Manager, CFO, CEO.`,go:['users','Open Users & roles']},
 {id:'audit',t:'Audit trail',k:['audit','audit trail','history','who changed','log','track changes'],
  a:`<b>Administration → Audit trail</b> records every change with user, time, device, and the previous and new value. Each invoice and form also has its own History panel. Financial records are voided or reversed, never deleted.`,go:['audit','Open Audit trail']},
 {id:'reports',t:'Reports',k:['report','reports','export a report','sales report','profit','loss','cash flow','aging','receivables report','export report'],
  a:`<b>Catalogue & records → Reports</b> has financial (sales, receivables aging, P&L, cash flow…), operational (branch and country performance, product sales, staff activity) and audit reports. Filter by period, country and currency; export to PDF, Excel or copy as CSV.`,go:['reports','Open Reports']},
 {id:'reminders',t:'Payment reminders and messages',k:['reminder','reminders','overdue reminder','communications','message history','automatic reminders'],
  a:`<b>Communications</b> shows every message sent and the automatic reminder rules (7 days before due, on the due date, 3 and 7 days overdue). Switch rules on or off there and edit the wording in Documents → Document templates. You can also send a reminder from any unpaid invoice.`,go:['communications','Open Communications']},
 {id:'templates',t:'Document templates and variables',k:['document template','templates','variables','placeholder','wording','customer_name'],
  a:`<b>Documents → Document templates</b> holds the wording for invoices, receipts, statements and reminder messages. Click a variable such as <span class="mono">{{customer_name}}</span> to insert it; the preview fills it from a real record so staff never retype data.`,go:['documents','Open Documents'],dtab:'templates'},
 {id:'documents',t:'Storing documents',k:['upload document','documents','contract','licence','attachment','file storage','expiry'],
  a:`<b>Documents → Repository</b> stores contracts, licences and supporting documents linked to customers, suppliers, expenses, branches or staff, with tags, version and expiry date. Documents expiring within 30 days appear on the Dashboard.`,go:['documents','Open Documents']},
 {id:'notifications',t:'Notifications',k:['notification','notifications','bell','alerts','alert'],
  a:`The bell at the top lists approvals waiting, payments received, overdue invoices, forms returned and expiring documents. Click one to open the record. The Dashboard’s <b>What needs attention today</b> panel summarises the same.`},
 {id:'security',t:'Security, 2FA and backups',k:['security','2fa','two factor','password','backup','restore','session','timeout','login','sign in'],
  a:`Sign-in uses a password plus a 6-digit two-factor code; sessions end after ${S.security.timeout} idle minutes. Sensitive actions need a second person’s PIN. Backups run daily at 02:00 with 30 daily and 12 monthly copies; see <b>Settings → Backup</b>.`,go:['settings','Open Settings'],tab:'backup'},
 {id:'logo',t:'Company details and logo on documents',k:['logo','company details','change the logo','logo on documents','the logo','letterhead','bank details','organization','organisation','branding'],
  a:`<b>Settings → Organization</b> holds the address, phone, email, tax ID, bank and mobile money details and the logo printed on every invoice, receipt and statement. Legal entity names per country are in <b>Countries & branches</b>.`,go:['settings','Open Settings'],tab:'org'}
];

function kbScore(q){const s=' '+q.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ')+' ';return KB.map(t=>{let sc=0;t.k.forEach(k=>{if(s.includes(' '+k+' ')||s.includes(' '+k+'s ')||s.includes(' '+k+'es '))sc+=k.includes(' ')?3:1});return {t,sc}}).sort((a,b)=>b.sc-a.sc)}
function kbAnswer(t){const bs=[];if(t.act&&(!t.act[2]||can(t.act[2])))bs.push(btn(t.act[1],t.act[0],{cls:'sm',kind:'pri',data:t.act[3]||{}}));if(t.go)bs.push(btn(t.go[1],'kbGo',{cls:'sm',data:{r:t.go[0],tab:t.tab||'',ff:t.ff||'',fil:t.fil||'',dtab:t.dtab||''}}));
  return `<b>${esc(t.t)}</b><div style="margin-top:4px">${t.a}</div>${bs.length?`<div class="row">${bs.join('')}</div>`:''}`}

function saveDraft(submit){const d=S.draft;const err=$('#d-err');if(d&&d.kind==='QUO')return saveQuote();
  if(!d.cust){err.textContent='Choose a customer first.';return}
  const items=d.items.filter(it=>it.desc&&it.qty>0&&it.price>0);if(!items.length){err.textContent='Add at least one line with a description, quantity and price.';return}
  if(d.due<d.date){err.textContent='Due date is before the invoice date.';return}
  d.items=items;const newTotal=calc(d).total;
  if(d.no){const old=invBy(d.no);const oldTotal=calc(old).total;const wasApproved=d.revision;Object.assign(old,JSON.parse(JSON.stringify(d)));
    if(wasApproved){old.version=(old.version||1)+1;old.generated=false;old.approvedBy='';old.status='Pending approval';delete old.revision}
    if(oldTotal!==newTotal)log('Changed invoice total',old.no,fmt(oldTotal,old.cur),fmt(newTotal,old.cur));else log('Edited invoice',old.no,'','Particulars updated');
    if(submit&&old.status==='Draft')old.status='Pending approval'}
  else{const inv=Object.assign(JSON.parse(JSON.stringify(d)),{no:nextNo(d.country,'INV'),rate:S.rates[d.cur],status:submit?'Pending approval':'Draft',createdBy:S.user,approvedBy:'',generated:false,version:1});inv.link='https://pay.dopay.example/i/'+token(inv.no);S.invoices.push(inv);d.no=inv.no;log('Created invoice',inv.no,'',fmt(newTotal,inv.cur))}
  const inv=invBy(d.no);if(inv.status==='Pending approval'){log('Submitted invoice for approval',inv.no,'Draft','Pending approval');notify(`Invoice ${inv.no} is awaiting approval`,'warn',['invoice',inv.no])}
  S.draft=null;toast(inv.status==='Pending approval'?'Submitted for approval':'Draft saved');go('invoice',{inv:inv.no})}

A.editInv=d=>{S.draft=JSON.parse(JSON.stringify(invBy(d.no)));go('invoice-new')};
A.editApproved=d=>requireAuth('Editing an approved invoice',()=>{S.draft=JSON.parse(JSON.stringify(invBy(d.no)));S.draft.revision=true;go('invoice-new');toast('Authorized. Saving sends the revision back for approval.')});
A.submitInv=d=>{const i=invBy(d.no);i.status='Pending approval';log('Submitted invoice for approval',i.no,'Draft','Pending approval');notify(`Invoice ${i.no} is awaiting approval`,'warn',['invoice',i.no]);toast('Submitted for approval');render(true)};
A.approveInv=d=>{const i=invBy(d.no);i.status='Approved';i.approvedBy=S.user;log('Approved invoice',i.no,'Pending approval','Approved');notify(`Invoice ${i.no} approved by ${me().name}`,'ok',['invoice',i.no]);toast('Approved. Generate the official PDF next.');render(true)};
A.rejectInv=d=>{openModal('Return to draft',`<div class="f"><label for="rej-c">Comment for ${esc(user(invBy(d.no).createdBy).name)}</label><textarea id="rej-c" placeholder="e.g. Use the distributor price for line 2"></textarea></div>`,btn('Cancel','closeModal')+btn('Return to draft','rejectOk',{kind:'pri',data:{no:d.no}}))};
A.rejectOk=d=>{const c=$('#rej-c').value.trim();const i=invBy(d.no);i.status='Draft';log('Returned invoice to draft',i.no,'Pending approval','Draft'+(c?' · '+c:''));notify(`Invoice ${i.no} returned to draft${c?': '+c:''}`,'warn',['invoice',i.no]);closeModal();render(true)};
A.generateInv=d=>{const i=invBy(d.no);i.generated=true;log('Generated official PDF',i.no,'','Version '+i.version+' · secure link issued');toast('Official PDF generated. Choose how to send it.');render(true)};
A.voidInv=d=>requireAuth('Voiding a draft invoice',a=>{const i=invBy(d.no);i.status='Cancelled';i.cancelReason=a.reason;log('Voided draft invoice (authorized by '+user(a.by).name+')',i.no,'Draft','Cancelled · '+a.reason);render(true)});
A.cancelInv=d=>{const i=invBy(d.no);if(i.paid>0){openModal('Can’t cancel yet',`<p>This invoice has ${fmt(i.paid,i.cur)} in payments applied. Reverse those payments first, or issue a credit note for what should not have been billed.</p>`,btn('Close','closeModal')+btn('Issue credit note','newCredit',{kind:'pri',data:{no:i.no}}));return}
  requireAuth('Cancelling an invoice',a=>{const prev=st(i);i.status='Cancelled';i.cancelReason=a.reason;log('Cancelled invoice (authorized by '+user(a.by).name+')',i.no,prev,'Cancelled · '+a.reason);render(true)})};
A.remindInv=d=>{const i=invBy(d.no);const t=st(i)==='Overdue'?'T10':'T8';const L=shareLinks('Invoice',i.no);const msg=fill(tpl(t).body,vars(i));
  openModal('Send payment reminder',`<div class="f"><label for="rm-t">Message (from “${esc(tpl(t).name)}”)</label><textarea id="rm-t" style="min-height:130px">${esc(msg)}</textarea></div><p class="small muted" style="margin-top:8px">To ${esc(cname(L.c))} · ${esc(L.c.phone)} · ${esc(L.c.email)}</p>`,
  `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${L.c.phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}" data-act="remindSend" data-no="${i.no}" data-ch="WhatsApp">${ic('chat',16)}WhatsApp</a>${btn('Email','remindSend',{data:{no:i.no,ch:'Email'},icon:'mail'})}${btn('Telegram','remindSend',{data:{no:i.no,ch:'Telegram'},icon:'send'})}`)};
A.remindSend=d=>{const i=invBy(d.no);comm({cust:i.cust,ref:i.no,kind:'Payment reminder',ch:d.ch});log('Sent payment reminder via '+d.ch,i.no);closeModal();toast(d.ch==='WhatsApp'?'WhatsApp opened with the reminder. Logged to the customer timeline.':'Reminder queued via '+d.ch+' and logged.')};

/* share */
A.share=(d,el)=>{const L=shareLinks(d.kind,d.ref);const ch=d.ch;
  const record=(status,extra)=>{comm({cust:L.c.id,ref:d.kind==='Statement'?'Statement '+S.stmtPeriod:d.ref,kind:d.kind,ch,status});log(`${ch==='PDF'?'Downloaded PDF of':ch==='Print'?'Printed':'Shared'} ${d.kind.toLowerCase()}${['PDF','Print','Copy link'].includes(ch)?'':' via '+ch}`,d.ref,'',extra||'');
    if(!['PDF','Print'].includes(ch))markSent(d.kind,d.ref)};
  if(ch==='WhatsApp'||ch==='Telegram'){record('Opened','To '+L.c.phone);toast(`${ch} opened with the message and secure link. Logged to ${cname(L.c)}'s timeline.`);setTimeout(()=>render(true),50);return}
  if(ch==='Copy link'){const done=()=>{record('Link copied');toast('Secure link copied');render(true)};try{navigator.clipboard.writeText(L.link).then(done,()=>{toast('Copy blocked here. Select the link below and copy it.')})}catch(e){toast('Copy blocked here. Select the link below and copy it.')}return}
  if(ch==='PDF'||ch==='Print'){record(ch==='PDF'?'Downloaded':'Downloaded');const fn=(d.kind==='Statement'?'Statement-'+d.ref:d.ref)+'.pdf';
    openModal(ch==='PDF'?'Download PDF':'Print',`<p>In the Laravel build this ${ch==='PDF'?'downloads':'sends to the printer'} <span class="mono">${esc(fn)}</span>, rendered server-side from the same template you see on screen (DomPDF / Browsershot).</p><p class="note" style="margin-top:12px">This preview page can't save files or open the print dialog, so the action is logged but no file is produced.</p>`,btn('OK','closeModal',{kind:'pri'}));render(true);return}
  if(ch==='Email'){openModal('Email '+d.kind.toLowerCase(),`<div class="fg"><div class="f"><label for="em-to">To</label><input id="em-to" value="${esc(L.c.email)}"></div><div class="f"><label for="em-cc">Cc</label><input id="em-cc" value="${esc(me().email)}"></div>
     <div class="f full"><label for="em-s">Subject</label><input id="em-s" value="${esc(d.kind+' '+(d.kind==='Statement'?'of account':d.ref)+' from '+orgName(L.c.country))}"></div><div class="f full"><label for="em-b">Message</label><textarea id="em-b" style="min-height:130px">${esc(L.msg)}</textarea></div></div>
     <p class="small muted" style="margin-top:8px">${ic('file',13)} Attached: <span class="mono">${esc(d.kind==='Statement'?'Statement-'+d.ref:d.ref)}.pdf</span></p>`,btn('Cancel','closeModal')+btn('Send email','emailSend',{kind:'pri',icon:'send',data:{kind:d.kind,ref:d.ref}}));return}
  if(ch==='IMO'||ch==='SMS'){openModal('Share via '+ch,`<p class="small" style="margin-bottom:10px">${ch==='IMO'?'IMO has no public business API. Copy this message and paste it into IMO; the share is still logged.':'SMS goes through the configured SMS gateway in the live system.'}</p><textarea class="inp" id="imo-t" style="min-height:120px">${esc(L.msg)}</textarea>`,btn('Cancel','closeModal')+btn(ch==='IMO'?'Copy & log':'Send SMS','imoSend',{kind:'pri',data:{kind:d.kind,ref:d.ref,ch}}));return}};
A.emailSend=d=>{const to=$('#em-to').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){toast('Enter a valid email address');return}const L=shareLinks(d.kind,d.ref);
  comm({cust:L.c.id,ref:d.ref,kind:d.kind,ch:'Email',status:'Queued'});log('Emailed '+d.kind.toLowerCase(),d.ref,'','To '+to);markSent(d.kind,d.ref)
  closeModal();toast('Email queued to '+to+' and logged');render(true)};
A.imoSend=d=>{const t=$('#imo-t').value;const L=shareLinks(d.kind,d.ref);const fin=()=>{comm({cust:L.c.id,ref:d.ref,kind:d.kind,ch:d.ch,status:d.ch==='IMO'?'Link copied':'Queued'});log('Shared '+d.kind.toLowerCase()+' via '+d.ch,d.ref);
    markSent(d.kind,d.ref);closeModal();toast(d.ch==='IMO'?'Message copied. Paste it into IMO.':'SMS queued');render(true)};
  if(d.ch==='IMO'){try{navigator.clipboard.writeText(t).then(fin,()=>{$('#imo-t').select();toast('Select and copy the text manually')})}catch(e){$('#imo-t').select()}}else fin()};

  <div class="f"><label for="cf-cat">Category</label><select id="cf-cat">${['Distributor','Retail','Health partner','Cooperative','Member'].map(x=>opt(x,x,c.category)).join('')}</select></div>
  <div class="f"><label for="cf-name">Full name (contact)</label><input id="cf-name" value="${esc(c.name||'')}"></div>
  <div class="f"><label for="cf-company">Company name</label><input id="cf-company" value="${esc(c.company||'')}" placeholder="Leave blank for individuals"></div>
  <div class="f"><label for="cf-phone">Phone</label><input id="cf-phone" value="${esc(c.phone||'')}" placeholder="+256 7…"></div>
  <div class="f"><label for="cf-email">Email</label><input id="cf-email" type="email" value="${esc(c.email||'')}"></div>
  <div class="f"><label for="cf-address">Address</label><input id="cf-address" value="${esc(c.address||'')}"></div>
  <div class="f"><label for="cf-city">City</label><input id="cf-city" value="${esc(c.city||'')}"></div>
  <div class="f"><label for="cf-branch">Branch</label><select id="cf-branch">${S.branches.map(b=>opt(b.id,b.name+' · '+country(b.cc).name,c.branch||(homeBr()))).join('')}</select><span class="hint">Country, currency and tax follow the branch</span></div>
  <div class="f"><label for="cf-tin">Tax ID (TIN)</label><input id="cf-tin" value="${esc(c.tin||'')}"></div>
  <div class="f"><label for="cf-terms">Payment terms</label><select id="cf-terms">${S.terms.map(t=>opt(t.days,t.label,c.terms??30)).join('')}</select></div>
  <div class="f"><label for="cf-credit">Credit limit</label><input id="cf-credit" type="number" min="0" value="${c.credit||0}"></div></div><p class="err" id="cf-err"></p>`}
A.newCustomer=()=>{closeAI();openModal('New customer',custForm(),btn('Cancel','closeModal')+btn('Save customer','saveCust',{kind:'pri'}),true)};
A.editCustomer=d=>openModal('Edit '+esc(cname(cust(d.id))),custForm(cust(d.id)),btn('Cancel','closeModal')+btn('Save changes','saveCust',{kind:'pri',data:{id:d.id}}),true);
A.saveCust=d=>{const g=k=>$('#cf-'+k).value.trim();if(!g('name')){$('#cf-err').textContent='Enter the contact’s full name.';return}if(!g('phone')&&!g('email')){$('#cf-err').textContent='Add a phone number or email so documents can be sent.';return}
  const br=g('branch');const cc=branch(br).cc;const o={type:g('type'),category:g('cat'),name:g('name'),company:g('company'),phone:g('phone'),email:g('email'),address:g('address'),city:g('city'),branch:br,country:cc,cur:country(cc).cur,tin:g('tin'),terms:+g('terms'),credit:+g('credit')||0};
  if(d.id){const c=cust(d.id);if(c.credit!==o.credit)log('Changed credit limit',c.id,fmt(c.credit,c.cur),fmt(o.credit,o.cur));Object.assign(c,o);log('Updated customer',c.id);closeModal();toast('Customer updated');render(true);return}
  const n=S.customers.filter(c=>c.country===cc).length+1;const id=`C-${cc}-${String(n).padStart(4,'0')}`;
  S.customers.push(Object.assign({id,gender:'',dob:'',regNo:'',industry:'',manager:S.user,idType:'',idNo:'',created:TODAY},o));log('Registered customer',id,'',cname(o));notify('New customer registered: '+cname(o),'info',['customer',id]);closeModal();toast('Customer saved');A.openCust({id})};
A.custSearch=()=>{};

/* payments */
function openInvoicesFor(cid){return S.invoices.filter(i=>i.cust===cid&&isLive(i)&&calc(i).bal>0).sort((a,b)=>a.due.localeCompare(b.due))}
function payModalBody(cid,pre){const c=cust(cid);const custs=S.customers.filter(inScope);
  const inv=c?openInvoicesFor(cid):[];
  return `<div class="fg"><div class="f full"><label for="pm-cust">Customer</label><select id="pm-cust" data-ch="pmCust"><option value="">Choose a customer…</option>${custs.map(x=>opt(x.id,cname(x)+' · '+x.id,cid)).join('')}</select></div>
   ${c?`<div class="f"><label for="pm-amt">Amount received (${c.cur})</label><input id="pm-amt" type="number" min="0" step="any" data-in="pmAmt" value="${pre||''}"></div>
   <div class="f"><label for="pm-date">Payment date</label><input id="pm-date" type="date" value="${TODAY}"></div>
   <div class="f"><label for="pm-method">Payment method</label><select id="pm-method">${S.methods.map(m=>opt(m,m,'Mobile money')).join('')}</select></div>
   <div class="f"><label for="pm-ref">Transaction reference</label><input id="pm-ref" placeholder="e.g. MTN-MP260926.1044.X12345"></div>
   <div class="f full"><div class="row" style="justify-content:space-between"><label>Allocate to invoices</label><button class="btn sm" data-act="autoAlloc">Auto-allocate oldest first</button></div>
   ${inv.length?`<div class="tw"><table class="tbl"><thead><tr><th>Invoice</th><th>Due</th><th class="num">Balance</th><th class="num">Apply</th></tr></thead><tbody>${inv.map(i=>`<tr><td class="mono small">${esc(i.no)}</td><td>${fdate(i.due)} ${st(i)==='Overdue'?pill('Overdue'):''}</td><td class="num">${fmtN(calc(i).bal,i.cur)}</td><td class="num"><input class="inp tab" style="max-width:140px;text-align:right;height:32px" type="number" min="0" step="any" data-in="alloc" data-no="${i.no}" data-max="${calc(i).bal}" value="0" aria-label="Amount for ${i.no}"></td></tr>`).join('')}</tbody></table></div>`:'<div class="note">No open invoices. The amount will sit as a credit on the customer’s account.</div>'}
   <div class="row" style="justify-content:space-between;margin-top:6px"><span class="small muted" id="pm-sum"></span></div></div>`:''}</div><p class="err" id="pm-err"></p>`}
A.recordPayment=d=>{closeAI();const cid=(d&&d.cust)||'';openModal('Record payment',payModalBody(cid),btn('Cancel','closeModal')+btn('Save & issue receipt','savePay',{kind:'pri',icon:'receipt'}),true);
  if(d&&d.inv){const i=invBy(d.inv);const b=calc(i).bal;$('#pm-amt').value=b;const inp=document.querySelector(`[data-no="${d.inv}"][data-in="alloc"]`);if(inp)inp.value=b;updPaySum()}};
A.createReceipt=()=>{A.recordPayment({});toast('Receipts are issued from a recorded payment, so the two always match.')};
function updPaySum(){const amt=parseFloat(($('#pm-amt')||{}).value)||0;let a=0;document.querySelectorAll('[data-in="alloc"]').forEach(x=>a+=parseFloat(x.value)||0);const c=cust($('#pm-cust').value);const s=$('#pm-sum');if(!s||!c)return;
  s.innerHTML=`Allocated <b>${fmt(a,c.cur)}</b> of ${fmt(amt,c.cur)}${amt-a>0.004?` · ${fmt(amt-a,c.cur)} goes to account credit`:''}${a-amt>0.004?' · <span style="color:var(--bad)">allocation exceeds amount</span>':''}`}
A.autoAlloc=()=>{let left=parseFloat($('#pm-amt').value)||0;document.querySelectorAll('[data-in="alloc"]').forEach(x=>{const m=parseFloat(x.dataset.max);const v=Math.min(m,left);x.value=v>0?v:0;left-=v});updPaySum()};
A.savePay=()=>{const cid=$('#pm-cust').value;const c=cust(cid);const err=$('#pm-err');if(!c){err.textContent='Choose a customer.';return}
  {const pd=$('#pm-date').value||TODAY;if(lockedFor(c.country,pd)){err.textContent=lockMsg(c.country,pd);return}}
  const amt=parseFloat($('#pm-amt').value)||0;if(amt<=0){err.textContent='Enter the amount received.';return}
  const ref=$('#pm-ref').value.trim();const method=$('#pm-method').value;if(method!=='Cash'&&!ref){err.textContent='Add the transaction reference for '+method.toLowerCase()+' payments.';return}
  const allocs=[];let sum=0;let over=false;document.querySelectorAll('[data-in="alloc"]').forEach(x=>{const v=parseFloat(x.value)||0;if(v>0){if(v>parseFloat(x.dataset.max)+0.004)over=true;allocs.push({inv:x.dataset.no,amt:v});sum+=v}});
  if(over){err.textContent='An allocation is larger than that invoice’s balance.';return}if(sum>amt+0.004){err.textContent='Allocations add up to more than the amount received.';return}
  if(!allocs.length){err.textContent='Allocate the payment to at least one invoice (use Auto-allocate).';return}
  const p={no:nextNo(c.country,'PAY'),cust:cid,date:$('#pm-date').value||TODAY,method,ref:ref||'CASH-'+branch(c.branch).id+'-'+uid().toUpperCase(),amount:amt,cur:c.cur,rate:S.rates[c.cur],allocs,branch:c.branch,by:S.user,status:'Completed',time:nowT()};
  S.payments.push(p);allocs.forEach(a=>invBy(a.inv).paid+=a.amt);const r={no:nextNo(c.country,'RCT'),pay:p.no,date:p.date,cust:cid,status:'Issued'};S.receipts.push(r);
  log('Recorded payment',p.no,'',`${fmt(amt,c.cur)} ${method.toLowerCase()} against ${allocs.map(a=>a.inv.slice(-6)).join(', ')}`);log('Issued receipt',r.no,'','For '+p.no);
  notify(`Payment received: ${fmt(amt,c.cur)} from ${cname(c)}`,'ok',['payments']);closeModal();toast('Payment recorded and receipt issued');go('receipt',{rct:r.no})};
A.reversePay=d=>requireAuth('Reversing a payment',a=>{const p=payBy(d.no);p.status='Reversed';p.reason=a.reason;p.allocs.forEach(x=>invBy(x.inv).paid-=x.amt);const r=S.receipts.find(r=>r.pay===p.no);if(r)r.status='Void';
  log('Reversed payment (authorized by '+user(a.by).name+')',p.no,'Completed · '+fmt(p.amount,p.cur),'Reversed · '+a.reason);notify(`Payment ${p.no} reversed`,'bad',['payments']);toast('Payment reversed; receipt voided');render(true)});

/* expenses */
A.newExpense=d=>{d=d||{};const br=d.br||(homeBr());S.expCtx={br};const cur=country(branch(br).cc).cur;
  openModal('New expense',`<div class="fg"><div class="f"><label for="ex-date">Date</label><input id="ex-date" type="date" value="${TODAY}"></div><div class="f"><label for="ex-cat">Category</label><select id="ex-cat">${S.expCats.map(c=>opt(c,c)).join('')}</select></div>
   <div class="f full"><label for="ex-desc">Description</label><input id="ex-desc" placeholder="What was this for?"></div>
   <div class="f"><label for="ex-amt">Amount (${cur})</label><input id="ex-amt" type="number" min="0" step="any"></div><div class="f"><label for="ex-method">Payment method</label><select id="ex-method">${S.methods.map(m=>opt(m,m)).join('')}</select></div>
   <div class="f"><label for="ex-sup">Supplier</label><select id="ex-sup"><option value="">None</option>${S.suppliers.map(s=>opt(s.id,s.company)).join('')}</select></div><div class="f"><label>Branch</label><input readonly value="${esc(branch(br).name)}"></div><div class="f"><label for="ex-vat">VAT on this bill <span class="muted">(input tax, if any)</span></label><input id="ex-vat" type="number" min="0" step="any" value="0"><span class="hint">From the supplier’s tax invoice; claimed back on the return</span></div><div class="f"><label for="ex-wht">Withholding tax %</label><input id="ex-wht" type="number" min="0" max="30" step="any" value="0"><span class="hint">Withheld from the supplier on the amount before VAT${S.whtRate&&S.whtRate[branch(br).cc]?` · usual rate ${S.whtRate[branch(br).cc]}%`:''}</span></div>${d.period?`<div class="f"><label for="ex-per">Tax period</label><input id="ex-per" type="month" value="${d.period}"><span class="hint">The month this return covers.</span></div>`:''}
   <div class="f full"><label for="ex-doc">Supporting document</label><input id="ex-doc" type="file" accept=".pdf,.jpg,.jpeg,.png,.docx,.xlsx"><span class="hint">Receipt, invoice or quote. PDF, JPG, PNG, DOCX or XLSX.</span></div></div><p class="err" id="ex-err"></p>`,
   btn('Cancel','closeModal')+btn('Save draft','saveExp',{data:{s:'Draft'}})+btn('Submit for review','saveExp',{kind:'pri',data:{s:'Submitted'}}),true)};
A.saveExp=d=>{const br=(S.expCtx&&S.expCtx.br)||(homeBr());const cc=branch(br).cc;const desc=$('#ex-desc').value.trim();const amt=parseFloat($('#ex-amt').value)||0;
  if(!desc||amt<=0){$('#ex-err').textContent='Add a description and an amount.';return}
  const vatIn=parseFloat(($('#ex-vat')||{}).value)||0,whtR=parseFloat(($('#ex-wht')||{}).value)||0;if(vatIn<0||vatIn>=amt){$('#ex-err').textContent='The VAT on the bill must be less than the amount.';return}if(whtR<0||whtR>30){$('#ex-err').textContent='Enter a withholding rate between 0 and 30%.';return}
  {const xd=$('#ex-date').value||TODAY;if(lockedFor(cc,xd)){$('#ex-err').textContent=lockMsg(cc,xd);return}}const f=$('#ex-doc').files[0];
  const e={no:nextNo(cc,'EXP'),date:$('#ex-date').value||TODAY,cat:$('#ex-cat').value,desc,amount:amt,cur:country(cc).cur,sup:$('#ex-sup').value,branch:br,method:$('#ex-method').value,doc:f?f.name:'',by:S.user,approvedBy:'',status:d.s};const per=$('#ex-per');if(per&&per.value&&e.cat==='Tax')e.taxPeriod=per.value;if(e.cat==='Tax'&&S.expCtx&&S.expCtx.taxKind)e.taxKind=S.expCtx.taxKind;if(vatIn>0&&e.cat!=='Tax')e.vatIn=rnd(vatIn,e.cur);if(whtR>0&&e.cat!=='Tax'){e.whtRate=whtR;e.wht=rnd((amt-(e.vatIn||0))*whtR/100,e.cur)}
  S.expenses.push(e);if(f)S.docs.unshift({id:uid(),name:f.name,type:(f.name.split('.').pop()||'').toUpperCase(),link:'Expense',linkId:e.no,cat:'Supporting document',tags:[e.cat.toLowerCase()],owner:S.user,up:TODAY,exp:'',ver:1,access:'Finance',branch:br});
  log(d.s==='Draft'?'Created expense draft':'Submitted expense',e.no,'',fmt(amt,e.cur));if(d.s==='Submitted')notify(`Expense ${e.no} is awaiting review`,'warn',['expenses']);closeModal();toast(d.s==='Draft'?'Expense saved as draft':'Expense submitted for review');render(true)};
A.advExp=d=>{const e=S.expenses.find(x=>x.no===d.no);const prev=e.status;const next=EXP_FLOW[EXP_FLOW.indexOf(prev)+1];
  if(next==='Approved'&&e.by===S.user){openModal('Separate approver needed',`<p>You submitted this expense, so someone else must approve it. <b>Prototype:</b> switch user to Patrick Mugisha at the top.</p>`,btn('OK','closeModal',{kind:'pri'}));return}
  e.status=next;if(next==='Approved')e.approvedBy=S.user;log('Expense '+next.toLowerCase(),e.no,prev,next);if(next==='Submitted')notify(`Expense ${e.no} is awaiting review`,'warn',['expenses']);toast(`${e.no.slice(-6)} → ${next}`);render(true)};

/* words */
const ONES=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function w999(n){let s='';const h=Math.floor(n/100),r=n%100;if(h)s+=ONES[h]+' hundred'+(r?' and ':'');if(r)s+=r<20?ONES[r]:TENS[Math.floor(r/10)]+(r%10?'-'+ONES[r%10]:'');return s}
function numWords(n){n=Math.floor(n);if(!n)return 'zero';const sc=['',' thousand',' million',' billion',' trillion'];const out=[];let i=0;while(n>0){const c=n%1000;if(c)out.unshift(w999(c)+sc[i]);n=Math.floor(n/1000);i++}return out.join(' ')}
const CURW={UGX:['Uganda shilling','Uganda shillings'],KES:['Kenya shilling','Kenya shillings'],NGN:['naira','naira','kobo'],XAF:['CFA franc','CFA francs'],XOF:['CFA franc','CFA francs'],THB:['baht','baht','satang'],LAK:['kip','kip'],USD:['US dollar','US dollars','cents']};
function amountWords(n,cur){const w=CURW[cur]||[cur,cur];const whole=Math.floor(n+1e-9);const fr=Math.round((n-whole)*100);let s=numWords(whole)+' '+(whole===1?w[0]:w[1]);if(fr&&w[2])s+=' and '+numWords(fr)+' '+w[2];s+=' only';return s.charAt(0).toUpperCase()+s.slice(1)}
function bahtText(n){const DG=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const part=(num,hi)=>{let s='';const t=String(num),L=t.length;for(let i=0;i<L;i++){const d=+t[i],p=L-i-1;if(!d)continue;if(p===1&&d===1)s+='สิบ';else if(p===1&&d===2)s+='ยี่สิบ';else if(p===0&&d===1&&(L>1||hi))s+='เอ็ด';else s+=DG[d]+P[p]}return s};
  const big=num=>{if(!num)return '';const m=Math.floor(num/1e6),r=num%1e6;return (m?big(m)+'ล้าน':'')+part(r,m>0)};
  const whole=Math.floor(n),sat=Math.round((n-whole)*100);let s=whole?big(whole)+'บาท':'';s+=sat?part(sat,false)+'สตางค์':(whole?'ถ้วน':'ศูนย์บาทถ้วน');return s}
function workdays(from,n){let d=from;let k=0;while(k<n){d=addDays(d,1);const w=D(d).getUTCDay();if(w!==0&&w!==6)k++}return d}

/* numbering */
function fPeriodTok(f){const d=f.data;return d.period==='Annual'?'FY':d.period==='Quarterly'?'Q'+d.quarter:'M'+String(d.month).padStart(2,'0')}
function fKey(f){const co=country(f.country),br=branch(f.branch);return f.type+co.dcode+(f.type==='B'?br.bcode:'')}
function fRefPreview(f){if(f.ref)return f.ref;const co=country(f.country),br=branch(f.branch);const n=(S.fseq[fKey(f)]||0)+1;const mm=f.type==='G'?String(f.data.month||'').slice(5,7):'';const yy=f.type==='G'&&f.data.month?String(f.data.month).slice(0,4):f.type==='F'?String(f.data.year):'2026';
  return S.fpat[f.type].replace('{CODE}',co.dcode).replace('{BR}',br.bcode||br.id).replace('{YYYY}',yy).replace('{###}',String(n).padStart(3,'0')).replace('{PERIOD}',fPeriodTok(f)).replace('{MM}',mm||'MM')}
function fAssignRef(f){if(f.ref)return;const ref=fRefPreview(f);S.fseq[fKey(f)]=(S.fseq[fKey(f)]||0)+1;f.ref=ref}

 A_CFO:[S1,{l:'2. Reviewed by Country Manager and Regional Manager',r:['Country Manager','Regional Manager']},S3,{l:'4. Final Approved by CFO or CEO',r:['CFO','CEO']}],
 B:[{l:'Paid by (Petty Cash Holder)',who:'holder'},{l:'Approved by (Accountant/Branch manager)',r:['Accountant','Branch Manager','Assistant Manager','Country Manager'],notHolder:true}],
 C:[{l:'Purchaser',who:'purchaser'},{l:'Approver (Accountant or Assistant Manager)',r:['Accountant','Assistant Manager']}],
 F:[{l:'Prepared by (Accountant)',who:'preparer'},{l:'Reviewed by (Financial Controller)',r:['Financial Controller']}],
 G:[{l:'Prepared by (Accountant)',who:'preparer'},{l:'Reviewed by (Country Manager or Assistant Manager)',r:['Country Manager','Assistant Manager']},{l:'Approved by (Financial Manager)',r:['Finance Manager']},{l:'Received by (Financial Controller)',r:['Financial Controller']}],
 J:[{l:'Prepared by Accountant (Requesting Branch)',who:'preparer'},{l:'Acknowledged by Accountant (Paying Branch)',r:['Accountant','Assistant Manager'],paying:true},{l:'Noted by (Financial Controller)',r:['Financial Controller']}],
 K:[{l:'1. Accountant or Assistant Manager',r:['Accountant','Assistant Manager']},{l:'2. Country Mgr (CM) or Regional Manager (RM)',r:['Country Manager','Regional Manager']},{l:'3. Financial Controller',r:['Financial Controller']},{l:'4. CFO',r:['CFO']},{l:'5. CEO',r:['CEO']}]};
const LOCAL_ROLES=['Country Administrator','Finance Manager','Auditor','Accountant','Assistant Manager','Country Manager','Branch Manager','Accounting Officer','Sales/Customer Officer','Document Officer'];
const chainOf=f=>f.type==='A'?(f.data.route==='RM'?CHAIN.A_RM:CHAIN.A_CFO):CHAIN[f.type];
const WHO={preparer:'Preparer',holder:'Petty cash holder',purchaser:'Purchaser'};
function canSign(st,f,uid){const u=user(uid);if(!u.id)return false;if(st.who==='preparer')return uid===f.by;if(st.who==='holder')return uid===f.data.holder;if(st.who==='purchaser')return uid===f.data.purchaser;
  if(!st.r.includes(u.role))return false;const cc=st.paying?f.data.paying:f.country;if(LOCAL_ROLES.includes(u.role)&&branch(u.branch).cc!==cc)return false;if(st.notHolder&&uid===f.data.holder)return false;return true}
const curStep=f=>f.status==='In approval'?(f.sigs||[]).findIndex(s=>!s):-1;
const awaitingMe=f=>{const i=curStep(f);return i>=0&&canSign(chainOf(f)[i],f,S.user)};
const stepWho=st=>st.who?WHO[st.who]:st.r.join(' / ');
function fStepLabel(f){const i=curStep(f);if(i<0)return '';return `Step ${i+1} of ${f.sigs.length} · ${stepWho(chainOf(f)[i])}`}
const chainSummary=t=>(t==='A'?CHAIN.A_CFO:CHAIN[t]).map(stepWho).map(s=>s.replace('Financial Controller','FC').replace('Country Manager','CM').replace('Regional Manager','RM').replace('Assistant Manager','AM')).join(' → ');
function lstamp(cc){const co=country(cc);let t=nowT();try{t=new Intl.DateTimeFormat('en-GB',{timeZone:co.tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date())}catch(e){}return t}
function mkSig(uid,cc,date,time){return {uid,date:date||TODAY,time:time||lstamp(cc),tz:country(cc).tzl,id:token(uid+(date||TODAY)+(time||'')+uid.length+Math.random()).slice(0,8).toUpperCase()}}
const sigHtml=s=>s?`<span class="sig">${esc(user(s.uid).name)}</span><span class="sigm">e-signed ${fdate(s.date)}, ${esc(s.time)} ${esc(s.tz)} · ${esc(s.id)}</span>`:'';
const fById=id=>S.forms.find(f=>f.id===id);
const isLocalCur=f=>f.cur===country(f.country).cur;

/* totals */
function gCalc(f){let bal=+f.data.opening||0,inT=0,outT=0;const rows=(f.lines||[]).map(r=>{const i=+r.inflow||0,o=+r.outflow||0;inT+=i;outT+=o;bal+=i-o;return Object.assign({bal},r)});return {rows,inT,outT,close:rnd(bal,f.cur),diff:rnd(bal-(+f.data.bankClosing||0),f.cur)}}
function fTotal(f){if(f.type==='F')return Object.values(f.budget||{}).reduce((a,arr)=>a+arr.reduce((x,y)=>x+(+y||0),0),0);if(f.type==='G')return gCalc(f).outT;return (f.lines||[]).reduce((a,l)=>a+(+l.amount||0),0)}
function budgetCols(f){const d=f.data;if(d.period==='Annual')return MON.slice();if(d.period==='Quarterly'){const q=+d.quarter;return MONL.slice((q-1)*3,q*3)}return [MONL[+d.month-1]]}
function fSubject(f){const d=f.data;switch(f.type){case 'A':case 'K':return d.subject;case 'B':return 'Pay '+(d.payTo||'—');case 'C':return (f.lines[0]||{}).desc||'Receipts not available';case 'F':return d.period+' budget · '+(d.period==='Annual'?d.year:d.period==='Quarterly'?'Q'+d.quarter+' '+d.year:MONL[d.month-1]+' '+d.year);case 'G':return 'Bank ledger · '+(d.month?MONL[+d.month.slice(5,7)-1]+' '+d.month.slice(0,4):'');case 'J':return orgName(d.paying)+' → '+orgName(d.receiving);}return ''}

function newFormDraft(t,pre){const br=homeBr();const cc=branch(br).cc;const co=country(cc);const u=me();
  const f={id:null,type:t,ref:null,country:cc,branch:br,cur:co.cur,status:'Draft',by:S.user,created:TODAY,data:{},lines:[],sigs:[],attach:[],history:[],version:1};
  const L=o=>Object.assign({desc:'',cat:'Office Expenses',amount:0},o);
  if(t==='A'){f.data={date:TODAY,route:'CFO',subject:'',payMethod:'Bank transfer',payOther:'',fromBank:'',acctNo:'',payDate:'',bankFee:'',just:'',reqName:u.name,reqDept:'Finance',cert:''};f.lines=[L({acct:''})]}
  if(t==='B'){f.data={date:TODAY,payTo:'',holder:S.user,memo:'',reimbursed:''};f.lines=[L({date:TODAY})]}
  if(t==='C'){f.data={lang:'en',purchaser:S.user,position:u.role,from:addDays(TODAY,-30),to:TODAY};f.lines=[{date:TODAY,desc:'',amount:0,note:''}]}
  if(t==='F'){f.data={period:'Monthly',year:2026,month:10,quarter:4,notes:{}};f.budget={}}
  if(t==='G'){f.data={month:'2026-09',acctName:orgName(cc)+' — operating account',acctNo:'',bank:'',opening:0,bankClosing:0,stmt:''};f.lines=[]}
  if(t==='J'){f.data={date:TODAY,paying:cc==='NG'?'UG':'NG',receiving:cc};f.cur='USD';f.lines=[{desc:'',amount:0,memo:''}]}
  if(t==='K'){const use=addDays(TODAY,3);f.data={date:TODAY,dept:'Accounts',subject:'',purpose:'1',purposeOther:'',just:'',use,liq:workdays(use,5),payMethod:'Mobile Money',payTo:''};f.lines=[L({cat:'Professional & Levy'})]}
  if(pre)pre(f);return f}

  ${f.lines.map(l=>`<tr><td>${l.date?fdate(l.date):''}</td><td>${esc(l.desc)}</td><td>${esc(l.cat)}</td><td class="r">${NF(l.amount,f)}</td></tr>`).join('')}${padRows(3-f.lines.length,4)}

function paperC(f){const d=f.data,th=d.lang==='th',tot=fTotal(f),ent=orgName(f.country),sg=f.sigs||[];

function paperK(f){const d=f.data,tot=fTotal(f);const cm=S.users.find(u=>u.role==='Country Manager'&&branch(u.branch).cc===f.country);const P=['Clearing Customs','Pocket money for international trips','Company Events','Other approved projects (specify)'];

function fValidate(f){const d=f.data,L=f.lines||[];const okL=L.some(l=>(l.desc||'').trim()&&+l.amount>0);

function histActual(cc,ci,mi,bud){if(mi>=8)return 0;const b=bud;if(!b)return 0;const fct=0.72+(((ci*7+mi*13)%11)/20);return Math.round(b*fct/1000)*1000}

V.budget=()=>{if(S.bmCountry&&!myAccts().includes(S.bmCountry))S.bmCountry='';if(S.acct!=='ALL')S.bmCountry=S.acct;const cc=S.bmCountry||homeCC();const co=country(cc);
  const bf=S.forms.find(f=>f.type==='F'&&f.country===cc&&f.data.period==='Annual'&&+f.data.year===2026&&['Approved','In approval'].includes(f.status));
  const head=ph('Budget monitoring',`${esc(co.entity)} · 2026 · ${co.cur}. Budget from the approved Annual Budget (Appendix F); actuals post automatically from paid expenses and memos.`,`<select class="sel" data-ch="bmCountry" aria-label="Country" ${S.acct!=='ALL'?'disabled':''}>${S.countries.filter(c=>myAccts().includes(c.code)).map(c=>opt(c.code,c.entity,cc)).join('')}</select>`);
  if(!bf)return head+`<section class="card empty">No approved 2026 annual budget for ${esc(co.entity)} yet.<div class="row" style="justify-content:center;margin-top:12px">${btn('Create annual budget','fNew',{kind:'pri',perm:'forms.submit',data:{t:'F',annual:'1',cc}})}</div></section>`;
  const m=S.bmMonth,ytd=S.bmMode==='ytd';const bud=(ci,mi)=>+((bf.budget[ci]||[])[mi])||0;const act=(ci,mi)=>histActual(cc,ci,mi,bud(ci,mi))+liveActual(cc,ci,mi);
  const val=(fn,ci)=>ytd?[...Array(m+1).keys()].reduce((a,k)=>a+fn(ci,k),0):fn(ci,m);
  const rows=CATS.map((c,ci)=>({ci,c,b:val(bud,ci),a:rnd(val(act,ci),co.cur)}));const S_=(a,b2)=>rows.slice(a,b2+1).reduce((x,r)=>({b:x.b+r.b,a:x.a+r.a}),{b:0,a:0});
  const bar=(b,a)=>{const p=b?a/b:(a?2:0);const w=Math.min(100,p*100);const col=p>1?'var(--bad)':p>.9?'var(--warn)':'var(--accent)';return `<div class="bmbar"><span style="width:${w}%;background:${col}"></span></div>`};
  const pct=(b,a)=>b?Math.round(a/b*100)+'%':(a?'no budget':'–');
  const tr=r=>`<tr><td>${r.ci+1}</td><td>${esc(r.c)}</td><td class="num">${fmtN(r.b,co.cur)}</td><td class="num">${fmtN(r.a,co.cur)}</td><td class="num" style="color:${r.b-r.a<0?'var(--bad)':'inherit'}">${fmtN(r.b-r.a,co.cur)}</td><td class="num" style="min-width:140px">${bar(r.b,r.a)}<span class="small">${pct(r.b,r.a)}</span></td></tr>`;
  const tt=(l,x)=>`<tr class="tt"><td></td><td class="strong">${l}</td><td class="num strong">${fmtN(x.b,co.cur)}</td><td class="num strong">${fmtN(x.a,co.cur)}</td><td class="num strong">${fmtN(x.b-x.a,co.cur)}</td><td class="num strong">${pct(x.b,x.a)}</td></tr>`;
  const over=rows.filter(r=>r.b&&r.a>r.b);

function msgText(s){return esc(s).replace(/@([A-Z][\w’'-]+(?: [A-Z][\w’'-]+)?)/g,'<span class="mention">@$1</span>')}
function refChip(r){if(!r||!r.id)return '';const act=r.k==='form'?`data-act="openForm" data-id="${esc(r.id)}"`:`data-act="openInv" data-no="${esc(r.id)}"`;return `<button class="refchip" ${act}>${ic(r.k==='form'?'doc2':'file',14)}<span class="mono">${esc(r.label)}</span></button>`}
function refOptions(){const f=S.forms.filter(x=>x.ref&&(inScope(x)||x.by===S.user||awaitingMe(x))).slice(0,12).map(x=>opt('form:'+x.id,x.ref+' · '+FT[x.type].name));const i=S.invoices.filter(inScope).slice(-8).reverse().map(x=>opt('invoice:'+x.no,x.no+' · '+cname(cust(x.cust))));
  return `<option value="">Attach a record…</option><optgroup label="Finance forms">${f.join('')}</optgroup><optgroup label="Invoices">${i.join('')}</optgroup>`}
function threadView(t){const my=ccOfUser(S.user);let lastDay='';
  const body=t.msgs.map(m=>{const day=dLocal(m.ms,my);const mine=m.from===S.user;const u=user(m.from);const scc=ccOfUser(m.from);
    let dh='';if(day!==lastDay){lastDay=day;const lbl=day===dLocal(Date.now(),my)?'Today':day===dLocal(Date.now()-864e5,my)?'Yesterday':fdate(day);dh=`<div class="day">${lbl}</div>`}
    const seen=mine&&t.type==='direct'&&m.read.includes(otherOf(t).id)?' · Seen':'';
    return dh+`<div class="bm ${mine?'me':''}">${mine||t.type==='direct'?'':`<span class="who"><b>${esc(u.name)}</b> · ${esc(u.role)} · ${esc(country(scc).name)}</span>`}<div class="bb">${msgText(m.text)}${m.ref?`<div>${refChip(m.ref)}</div>`:''}</div><span class="t" title="${scc!==my?'Sent '+tLocal(m.ms,scc)+' in '+esc(branch(u.branch).name):''}">${tLocal(m.ms,my)}${scc!==my&&!mine?' · '+tLocal(m.ms,scc)+' for them':''}${seen}</span></div>`}).join('');
  return `<div class="chat-h"><button class="btn ghost sm chat-back" data-act="closeThread" aria-label="Back to conversations">←</button><span class="cav ${t.type}">${t.type==='direct'?esc(initials(otherOf(t).name)):'#'}</span><div style="min-width:0;flex:1"><b>${esc(threadName(t))}</b><div class="small muted">${threadSub(t)}</div></div>${t.type!=='direct'?`<button class="btn sm" data-act="threadMembers" data-id="${t.id}">${ic('users',14)}${t.members.length}</button>`:''}</div>
  <div class="chat-body" id="chatBody">${body||'<div class="empty">No messages yet. Say hello.</div>'}</div>
  <form class="composer" onsubmit="return false"><textarea class="inp" id="msgText" placeholder="Message ${esc(threadName(t))}… (Enter to send, Shift+Enter for a new line, @Name to mention)" aria-label="Message"></textarea><div class="row" style="justify-content:space-between"><select class="sel" id="msgRef" style="max-width:320px" aria-label="Attach a record">${refOptions()}</select>${btn('Send','sendMsg',{kind:'pri',icon:'send',data:{id:t.id}})}</div></form>`}
function teamHtml(){const q=S.threadQ.toLowerCase();const list=myThreads().filter(t=>!q||threadName(t).toLowerCase().includes(q)||t.msgs.some(m=>m.text.toLowerCase().includes(q))).sort((a,b)=>lastMs(b)-lastMs(a));
  const cur=myThreads().find(t=>t.id===S.thread);if(cur)cur.msgs.forEach(m=>{if(!m.read.includes(S.user))m.read.push(S.user)});const my=ccOfUser(S.user);
  return `<div class="chat ${cur?'has-thread':''}"><aside class="card chat-list"><div class="chat-lh"><input class="inp" id="threadQ" data-in="threadQ" placeholder="Search people or messages" value="${esc(S.threadQ)}" aria-label="Search conversations">${btn('New','newThread',{kind:'pri',cls:'sm',icon:'plus'})}</div>
   <div class="chat-items" id="chatItems">${chatItems(list,cur,my)}</div></aside>
   <section class="card chat-main">${cur?threadView(cur):`<div class="empty" style="margin:auto">${ic('chat',28)}<p style="margin-top:8px">Pick a conversation, or start a new one with anyone in any branch or country.</p><div class="row" style="justify-content:center;margin-top:10px">${btn('New message','newThread',{kind:'pri',icon:'plus'})}</div></div>`}</section></div>`}
function chatItems(list,cur,my){return list.map(t=>{const lm=t.msgs[t.msgs.length-1];const un=unreadIn(t);const d=lm?dLocal(lm.ms,my):'';const when=lm?(d===dLocal(Date.now(),my)?tLocal(lm.ms,my).split(' ')[0]:fdate(d).slice(0,6)):'';
  return `<button class="ci ${cur&&cur.id===t.id?'on':''} ${un?'unread':''}" data-act="openThread" data-id="${t.id}"><span class="cav ${t.type}">${t.type==='direct'?esc(initials(otherOf(t).name)):'#'}</span><span class="cm"><b>${esc(threadName(t))}</b><span>${lm?(lm.from===S.user?'You: ':t.type!=='direct'?esc(user(lm.from).name.split(' ')[0])+': ':'')+esc(lm.text):'No messages yet'}</span></span><span class="cr"><span>${when}</span>${un?`<i>${un}</i>`:''}</span></button>`}).join('')||'<div class="empty">No conversations match.</div>'}

A.saveSupplier=d=>{if(!can('suppliers.manage'))return;const g=k=>$('#sf-'+k).value.trim();const e=m=>{$('#sf-err').textContent=m};
  if(!g('company'))return e('Enter the supplier’s company name.');if(!g('phone')&&!g('email'))return e('Add a phone number or email.');

  S.payments.filter(p=>branch(p.branch).cc===cc&&p.status!=='Failed').forEach(p=>{const cash=A(METHOD_ROLE[p.method]||'bank');const amt=fxTo(p.amount,p.cur,cur);
    add('PAY',p.no,p.date,'Payment · '+cname(cust(p.cust))+(p.ref?' · '+p.ref:''),[{a:cash,dr:amt},{a:A('ar'),cr:amt}],['nav',{r:'payments'}]);

  lines.filter(s=>!s.match).forEach(s=>{const c=book.filter(b=>!used.has(b.key)&&Math.abs(b.amount-s.amount)<0.5&&Math.abs(diff(b.e.date,s.date))<=5);

function fxReval(cc,month){const cur=country(cc).cur;const out=[];S.forms.filter(f=>f.type==='J'&&['Approved','Paid'].includes(f.status)&&(f.data.paying===cc||f.data.receiving===cc)&&f.cur!==cur&&(f.approvedAt||f.data.date).slice(0,7)<=month).forEach(f=>{
  const fc=fTotal(f);const booked=fc/(f.bookedRates||S.rates)[f.cur]*((f.bookedRates||S.rates)[cur]);const now=fc/S.rates[f.cur]*S.rates[cur];const done=S.journals.filter(j=>j.cc===cc&&j.reval===f.ref).reduce((s,j)=>s+(j.revalAmt||0),0);
  const delta=rnd((now-booked)-done,cur);if(Math.abs(delta)>=1)out.push({f,delta,side:f.data.paying===cc?'rec':'pay'})});return out}
V.close=()=>{const cc=pickCC('ledCC');const cur=country(cc).cur;const F=v=>fmtN(rnd(v,cur),cur);const last=S.closed[cc];const next=last?(()=>{const [y,m]=last.split('-').map(Number);return m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`})():TODAY.slice(0,7);

  return ph('Month-end close','Close each month once the books are right. A closed month is locked: nothing dated in it can be added or changed unless a Finance Manager reopens it with a second person’s approval.','')+ccTabs('ledCC','ccPick')+

   <div class="li">${checks.map(([ok,t,d,req])=>`<div class="li-row" style="cursor:default"><span class="avt ${ok?'':'y'}" style="width:30px;height:30px">${ok?'✓':req?'!':'·'}</span><div class="m"><b>${esc(t)}</b><span>${esc(d)}</span></div>${!ok&&t.startsWith('Reconcile')?`<button class="btn sm" data-act="nav" data-r="recon">Open</button>`:''}${!ok&&t.startsWith('Currency')&&can('accounting.post')?`<button class="pay-btn" data-act="fxPost">Post revaluation</button>`:''}</div>`).join('')}</div>
   <div class="pad row" style="justify-content:space-between;border-top:1px solid var(--grid)"><span class="small muted">${blocking?blocking+' required step'+(blocking>1?'s':'')+' left. Warnings (·) don’t block the close.':'All required steps are done.'}</span>${canClose?(blocking?`<button class="btn pri" disabled title="Finish the required steps first">Close ${monthName}</button>`:btn('Close '+monthName,'closeMonth',{kind:'pri',data:{m:next}})):'<span class="small muted">Finance Managers close periods</span>'}</div></section>
   <section class="card"><div class="card-h"><h3>Closed months</h3>${last&&canClose?btn('Reopen '+MONL[+last.slice(5)-1],'reopenMonth',{cls:'sm'}):''}</div>
   <div class="li">${['2026-07','2026-08','2026-09'].map(x=>`<div class="li-row" style="cursor:default"><div class="m"><b>${MONL[+x.slice(5)-1]} ${x.slice(0,4)}</b><span>${lockedFor(cc,x+'-01')?'Locked':'Open'}</span></div>${pill(lockedFor(cc,x+'-01')?'Closed':'Open period')}</div>`).join('')}</div></section></div>

/* ============ TAXES ============ */
const TAXRX=/\b(vat|tva)\b/i;
const ym=d=>d.slice(0,7);
const prevYM=d=>{const [y,m]=d.slice(0,7).split('-').map(Number);return m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`};
const nextYM=p=>{const [y,m]=p.split('-').map(Number);return m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`};
const ymLabel=p=>MONL[+p.slice(5)-1]+' '+p.slice(0,4);
const taxDue=(cc,p)=>nextYM(p)+'-'+String(country(cc).filing||15).padStart(2,'0');
const taxPays=cc=>S.expenses.filter(e=>e.cat==='Tax'&&branch(e.branch).cc===cc&&e.status!=='Rejected');
const isVatPay=e=>TAXRX.test(e.desc);
const payPeriod=e=>e.taxPeriod||prevYM(e.date);
const taxCCs=()=>S.acct==='ALL'?myAccts():[S.acct];
function vatPeriods(cc){const cur=country(cc).cur;const invs=S.invoices.filter(i=>i.country===cc&&isLive(i));const pays=taxPays(cc).filter(e=>isVatPay(e)&&e.taxKind!=='WHT'&&e.taxKind!=='PAYE');
  const cns=(S.credits||[]).filter(n=>n.country===cc&&n.status==='Approved');const ins=S.expenses.filter(e=>branch(e.branch).cc===cc&&['Approved','Paid'].includes(e.status)&&+e.vatIn>0);
  const set=new Set([...invs.map(i=>ym(i.date)),...pays.map(payPeriod),...cns.map(n=>ym(n.date)),...ins.map(e=>ym(e.date)),ym(TODAY)]);
  return [...set].sort().reverse().map(p=>{const pi=invs.filter(i=>ym(i.date)===p);let net=0,vat=0;pi.forEach(i=>{const k=calc(i);net+=k.sub-k.disc;vat+=k.tax});
    const pc=cns.filter(n=>ym(n.date)===p);let cvat=0;pc.forEach(n=>{const k=calc(n);net-=k.sub-k.disc;vat-=k.tax;cvat+=k.tax});
    const inp=rnd(ins.filter(e=>ym(e.date)===p).reduce((a,e)=>a+(+e.vatIn||0),0),cur);
    const pp=pays.filter(e=>payPeriod(e)===p);const paid=pp.filter(e=>e.status==='Paid').reduce((a,e)=>a+e.amount,0);const pend=pp.filter(e=>e.status!=='Paid').reduce((a,e)=>a+e.amount,0);
    vat=rnd(vat,cur);net=rnd(net,cur);const bal=rnd(vat-inp-paid,cur);const due=taxDue(cc,p);const open=p>=ym(TODAY);
    const status=open?'Open period':bal<=0?'Paid':pend>0?'In approval':due<TODAY?'Overdue':'Due';
    return {p,n:pi.length,net,vat,cvat:rnd(cvat,cur),inp,paid,pend,bal,due,status,inv:pi,cns:pc}})}
function taxAlerts(){return taxCCs().map(cc=>{const r=vatPeriods(cc).filter(r=>r.bal>0&&(r.status==='Overdue'||r.status==='In approval'||diff(TODAY,r.due)<=21)).sort((a,b)=>a.due.localeCompare(b.due))[0];return r?{cc,r}:null}).filter(Boolean)}
function dueTxt(d){const n=diff(TODAY,d);return n<0?`${-n} day${n===-1?'':'s'} late`:n===0?'due today':`in ${n} day${n===1?'':'s'}`}
V.taxes=()=>{const ccs=taxCCs();if(!ccs.includes(S.taxCC))S.taxCC=ccs[0];
  const cc=S.taxCC,co=country(cc),cur=co.cur,rows=vatPeriods(cc),yr=rows.filter(r=>r.p.startsWith(TODAY.slice(0,4))),N=v=>fmtN(v,cur),sum=k=>rnd(yr.reduce((a,r)=>a+r[k],0),cur);
  const owe=rows.filter(r=>r.status!=='Open period'&&r.bal>0).sort((a,b)=>a.due.localeCompare(b.due));const oweT=rnd(owe.reduce((a,r)=>a+r.bal,0),cur);

/* ----- a scannable-looking stamp; the live build prints the authority's real QR code ----- */
function qrSvg(t,px){const n=25;let h=2166136261;const bits=[];for(let i=0;i<n*n;i++){h^=(t.charCodeAt(i%t.length)||7)+i;h=Math.imul(h,16777619);bits.push((h>>>9)&1)}
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#000"/>`;
  const inF=(x,y)=>(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8);let r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(!inF(x,y)&&bits[y*n+x])r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  return `<svg class="qr" viewBox="-1 -1 ${n+2} ${n+2}" width="${px}" height="${px}" role="img" aria-label="QR code"><rect x="-1" y="-1" width="${n+2}" height="${n+2}" fill="#fff"/><g fill="#000">${r}</g>${fin(0,0)}${fin(n-7,0)}${fin(0,n-7)}</svg>`}
function fiscalBlock(d,lg){const f=d.fiscal;if(!f||f.status!=='Accepted')return '';const E=S.einv[d.country];const W=DOCW[lg];
  return `<div class="p-fiscal">${qrSvg(f.no+f.code,74)}<div><b>${esc(E.sys)} · ${esc(E.auth)}</b><br>${esc(E.docNo)}: <span class="mono">${esc(f.no)}</span><br>${W.vcode}: <span class="mono">${esc(f.code)}</span><br>${W.fiscal} ${fdateL(f.at,lg)}, ${esc(f.at.slice(11,16))}${f.test?`<br><b style="color:#C53030">${W.test}</b>`:''}</div></div>`}

function fiscalise(d){const E=S.einv[d.country];const kind=d.kind||(d.inv?'CRN':'INV');
  if(!E||E.mode==='Not connected'){d.fiscal={status:'Not submitted',at:stamp(),msg:(E&&E.note)||'E-invoicing is not connected for this country.',kind};return d.fiscal}
  const c=cust(d.cust)||{};const k=calc(d);const co=country(d.country);const errs=[];
  if(E.buyerTin&&c.type==='Business'&&!c.tin)errs.push(`Buyer ${TINL[d.country]||'TIN'} is required for business customers.`);
  if(!(k.total>0))errs.push('The total must be above zero.');
  if((d.items||[]).some(it=>!(+it.tax===0||+it.tax===co.tax)))errs.push(`Each line must use the standard rate (${co.tax}%) or be exempt.`);
  if(kind==='CRN'){const i=invBy(d.inv);if(!i||(i.fiscal&&i.fiscal.status==='Rejected'))errs.push('The original invoice was rejected by '+E.auth+', so this credit note cannot reference it.')}
  const at=P2Q?(d.date||TODAY)+' 10:15':stamp();
  if(errs.length){d.fiscal={status:'Rejected',at,msg:errs.join(' '),test:E.mode==='Test mode',kind};if(!P2Q){log('E-invoice rejected by '+E.auth,d.no,'',d.fiscal.msg);notify(`${E.auth} rejected ${d.no}: ${errs[0]}`,'bad',kind==='CRN'?['credits']:['invoice',d.no])}return d.fiscal}
  const h=token(d.no+E.sys+(d.version||1));const num=[...(d.no+E.sys)].reduce((a,ch)=>(a*31+ch.charCodeAt(0))%1e9,7);
  const no=d.country==='UG'?'32'+String(num).padStart(9,'0')+String(num%9973).padStart(4,'0'):d.country==='NG'?`${d.no.slice(-6)}-${h.slice(0,8).toUpperCase()}-${(d.date||TODAY).replace(/-/g,'')}`:`FNE${(d.date||TODAY).slice(2,4)}${String(num%1e8).padStart(8,'0')}`;
  d.fiscal={status:'Accepted',no,code:h.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12),at,test:E.mode==='Test mode',kind};if(!P2Q)log('E-invoice accepted by '+E.auth,d.no,'',E.docNo+' '+no);return d.fiscal}

A.runReminders=()=>{let n=0,skip=0;S.invoices.filter(i=>inScope(i)&&isLive(i)&&calc(i).bal>0).forEach(i=>{const d=diff(i.due,TODAY);let r=null;
   if(d>=-7&&d<0)r=S.reminders[0];else if(d===0)r=S.reminders[1];else if(d>=3&&d<7)r=S.reminders[2];else if(d>=7)r=S.reminders[3];

function saveQuote(){const d=S.draft;const err=$('#d-err');
  if(!d.cust){err.textContent='Choose a customer first.';return}
  const items=d.items.filter(it=>it.desc&&it.qty>0&&it.price>0);if(!items.length){err.textContent='Add at least one line with a description, quantity and price.';return}
  if(d.due<d.date){err.textContent='The quote expires before its own date.';return}
  if(d.no){const q=qBy(d.no);if(!['Draft','Sent'].includes(q.status)){err.textContent='Only draft or sent quotes can be edited.';return}
    const old=calc(q).total;Object.assign(q,{cust:d.cust,country:d.country,branch:d.branch,cur:d.cur,date:d.date,due:d.due,items:copyItems(items),notes:d.notes,terms:d.terms,version:(q.version||1)+1});
    log('Edited quote',q.no,fmt(old,q.cur),fmt(calc(q).total,q.cur)+' · revision '+q.version);S.draft=null;toast('Quote updated');go('quote',{quo:q.no});return}
  const q={kind:'QUO',no:nextNo(d.country,'QUO'),cust:d.cust,country:d.country,branch:d.branch,cur:d.cur,date:d.date,due:d.due,items:copyItems(items),notes:d.notes,terms:d.terms,status:'Draft',createdBy:S.user,version:1};
  q.link='https://pay.dopay.example/q/'+token(q.no);S.quotes.push(q);log('Created quote',q.no,'',fmt(calc(q).total,q.cur));S.draft=null;toast('Quote saved. Send it from this page.');go('quote',{quo:q.no})}

function runSchedule(r){const c=cust(r.cust);if(lockedFor(r.country,r.next))return null;
  const inv={no:nextNo(r.country,'INV'),cust:r.cust,country:r.country,branch:r.branch,cur:r.cur,rate:S.rates[r.cur],date:r.next,due:addDays(r.next,c.terms),status:'Approved',paid:0,notes:'',terms:'',generated:false,version:1,createdBy:'SYS',approvedBy:r.approvedBy,items:copyItems(r.items),recurring:r.id};
  inv.link='https://pay.dopay.example/i/'+token(inv.no);S.invoices.push(inv);log('Raised recurring invoice',inv.no,r.id,r.name+' · '+fmt(calc(inv).total,inv.cur));
  const f=fiscalise(inv);if(f.status==='Rejected'){notify(`Recurring invoice ${inv.no} was rejected by ${S.einv[inv.country].auth}: ${f.msg}`,'bad',['invoice',inv.no])}
  else{inv.generated=true;if(r.send){inv.status='Sent';inv.sentAt=TODAY;comm({cust:r.cust,ref:inv.no,kind:'Invoice',ch:r.send,by:'SYS',status:'Delivered'})}}
  r.runs.push(inv.no);r.last=r.next;r.next=addMonths(r.next,r.every);if(r.end&&r.next>r.end)r.status='Finished';return inv}
V.recurring=()=>{const list=S.recurring.filter(inScope);const due=recDue();const sc=scopeCur(),F=v=>fmt(rnd(v,sc),sc);

  return ph('Recurring invoices','Invoices that raise themselves on a schedule: rent, retainers, monthly supplies. A schedule is approved once; every invoice it raises is then issued, fiscalised and sent automatically.',
